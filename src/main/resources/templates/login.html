<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Railway System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0 fw-bold">Login</h4>
        </div>
        <div class="card-body p-4">

          <div th:if="${param.error}" class="alert alert-danger text-center">
            Invalid NIC/Email or Password.
          </div>
          <div th:if="${param.logout}" class="alert alert-success text-center">
            You have been logged out successfully.
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label fw-bold">NIC or Email Address</label>
              <input type="text" name="username" class="form-control form-control-lg"
                     placeholder="Enter NIC or Email" required autofocus>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input type="password" name="password" class="form-control form-control-lg"
                     placeholder="Enter Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3">Log In</button>
          </form>

          <div class="text-center mt-4">
            <p class="mb-0">Don't have an account? <a href="/register" class="text-decoration-none fw-bold">Sign Up Here</a></p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
