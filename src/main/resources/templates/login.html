<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Login - Railway System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header text-center bg-primary text-white">
          <h4>Login to Your Account</h4>
        </div>
        <div class="card-body">
          <div th:if="${param.error}" class="alert alert-danger">Invalid NIC or Password</div>
          <div th:if="${param.logout}" class="alert alert-success">You have been logged out successfully</div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label">NIC Number</label>
              <input type="text" name="username" class="form-control" placeholder="123456789V" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <div class="text-center mt-3">
            <a href="/register">Don't have an account? Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
