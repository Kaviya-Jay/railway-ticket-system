<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Available Trains</h3>
    <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning">No trains found for selected route and date.</div>

    <div class="row" th:each="train : ${trains}">
        <div class="col-md-12 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 th:text="${train.trainName}"></h5>
                    <p>
                        <strong>From:</strong> <span th:text="${train.startStation.stationName}"></span> &nbsp;→&nbsp;
                        <strong>To:</strong> <span th:text="${train.endStation.stationName}"></span><br>
                        <strong>Departure:</strong> <span th:text="${train.departureTime}"></span> |
                        <strong>Arrival:</strong> <span th:text="${train.arrivalTime}"></span>
                    </p>

                    <h6>Available Classes</h6>
                    <div class="row">
                        <div th:each="seatClass : ${train.seatClasses}" class="col-md-4 mb-2">
                            <div class="border p-3 rounded">
                                <strong th:text="${seatClass.classType} + ' Class'"></strong><br>
                                Price: Rs. <span th:text="${seatClass.price}"></span><br>
                                Seats Left: <span th:text="${seatClass.availableSeats}"></span>
                                <a th:href="@{/booking/confirm(trainId=${train.id}, seatClassId=${seatClass.id}, journeyDate=${journeyDate})}"
                                   class="btn btn-success btn-sm mt-2">Book Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <a href="/search" class="btn btn-secondary">Back to Search</a>
</div>
</body>
</html>
