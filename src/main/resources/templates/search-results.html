<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Search Results - Railway System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h2 class="mb-4">Available Trains from
        <span th:text="${#lists.isEmpty(trains) ? '' : trains[0].startStation.stationName}"></span>
        to
        <span th:text="${#lists.isEmpty(trains) ? '' : trains[0].endStation.stationName}"></span>
    </h2>

    <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning text-center py-4">
        <h5>No trains found for the selected route and date.</h5>
        <a href="/search" class="btn btn-primary mt-3">Try Another Search</a>
    </div>

    <div class="row" th:each="train : ${trains}">
        <div class="col-12 mb-4">
            <div class="card">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h4 class="fw-bold" th:text="${train.trainName}"></h4>
                            <p class="mb-1">
                                <strong>Departure:</strong> <span th:text="${train.departureTime}"></span> &nbsp;&nbsp;
                                <strong>Arrival:</strong> <span th:text="${train.arrivalTime}"></span>
                            </p>
                            <p><strong>Date:</strong> <span th:text="${journeyDate}"></span></p>
                        </div>

                        <div class="col-md-4">
                            <div th:each="seatClass : ${train.seatClasses}" class="mb-3 border p-3 rounded bg-light">
                                <div class="d-flex flex-column">
                                    <div class="mb-2">
                                        <strong th:text="${seatClass.classType} + ' Class'"></strong><br>
                                        <small>Price per Seat: Rs. <span th:text="${seatClass.price}"></span></small><br>
                                        <small class="text-success fw-bold" th:text="${seatClass.availableSeats} + ' seats left'"></small>
                                    </div>

                                    <form th:action="@{/booking/confirm}" method="get" class="mt-2">
                                        <input type="hidden" name="trainId" th:value="${train.id}">
                                        <input type="hidden" name="seatClassId" th:value="${seatClass.id}">
                                        <input type="hidden" name="journeyDate" th:value="${journeyDate}">

                                        <div class="input-group input-group-sm mb-2">
                                            <span class="input-group-text">Qty</span>
                                            <input type="number" name="quantity" class="form-control qty-input"
                                                   value="1" min="1" th:max="${seatClass.availableSeats}"
                                                   th:data-price="${seatClass.price}"
                                                   onchange="updatePrice(this)" onkeyup="updatePrice(this)" required>
                                        </div>

                                        <div class="mb-2 text-end">
                                            <strong>Total: Rs. <span class="total-price text-danger fs-5" th:text="${seatClass.price}"></span></strong>
                                        </div>

                                        <sec:authorize access="isAnonymous()">
                                            <a th:href="@{/login(loginRequired=true)}" class="btn btn-outline-primary btn-sm w-100 fw-bold">Login to Book</a>
                                        </sec:authorize>

                                        <sec:authorize access="isAuthenticated()">
                                            <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">Book Now</button>
                                        </sec:authorize>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/search" class="btn btn-secondary">← Back to Search</a>
    </div>
</div>

<script>
    function updatePrice(input) {
        let qty = parseInt(input.value);
        let maxQty = parseInt(input.getAttribute('max'));

        if(qty > maxQty) {
            input.value = maxQty;
            qty = maxQty;
        } else if (qty < 1 || isNaN(qty)) {
            qty = 1;
        }

        let price = parseFloat(input.getAttribute('data-price'));
        let total = qty * price;
        input.closest('form').querySelector('.total-price').innerText = total.toFixed(2);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
