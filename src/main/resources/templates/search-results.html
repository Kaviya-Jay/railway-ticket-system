<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Search Results - Railway System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h2 class="mb-4">Available Trains from
        <span th:text="${#lists.isEmpty(trains) ? '' : trains[0].startStation.stationName}"></span>
        to
        <span th:text="${#lists.isEmpty(trains) ? '' : trains[0].endStation.stationName}"></span>
    </h2>

    <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning text-center py-4">
        <h5>No trains found for the selected route and date.</h5>
        <a href="/search" class="btn btn-primary mt-3">Try Another Search</a>
    </div>

    <div class="row" th:each="train : ${trains}">
        <div class="col-12 mb-4">
            <div class="card">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h4 class="fw-bold" th:text="${train.trainName}"></h4>
                            <p class="mb-1">
                                <strong>Departure:</strong> <span th:text="${train.departureTime}"></span> &nbsp;&nbsp;
                                <strong>Arrival:</strong> <span th:text="${train.arrivalTime}"></span>
                            </p>
                            <p><strong>Date:</strong> <span th:text="${journeyDate}"></span></p>
                        </div>

                        <!-- Seat Classes -->
                        <div class="col-md-4">
                            <div th:each="seatClass : ${train.seatClasses}" class="mb-3 border p-3 rounded">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong th:text="${seatClass.classType} + ' Class'"></strong><br>
                                        <small>Rs. <span th:text="${seatClass.price}"></span></small><br>
                                        <small class="text-success" th:text="${seatClass.availableSeats} + ' seats left'"></small>
                                    </div>

                                    <!-- Login to Book for Guests -->
                                    <sec:authorize access="isAnonymous()">
                                        <a href="/login?loginRequired=true"
                                           class="btn btn-outline-primary btn-sm">
                                            Login to Book
                                        </a>
                                    </sec:authorize>

                                    <!-- Book Now for Logged-in -->
                                    <sec:authorize access="isAuthenticated()">
                                        <a th:href="@{/booking/confirm(trainId=${train.id},
                                                                   seatClassId=${seatClass.id},
                                                                   journeyDate=${journeyDate})}"
                                           class="btn btn-success btn-sm">
                                            Book Now
                                        </a>
                                    </sec:authorize>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/search" class="btn btn-secondary">← Back to Search</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
