<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results - Railway System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
        <h3 class="fw-bold mb-0 text-dark">
            🚂 Available Trains from
            <span class="text-primary" th:text="${#lists.isEmpty(trains) ? '' : trains[0].startStation.stationName}"></span>
            to
            <span class="text-primary" th:text="${#lists.isEmpty(trains) ? '' : trains[0].endStation.stationName}"></span>
        </h3>
        <span class="badge bg-dark fs-6 px-3 py-2" th:text="${journeyDate}"></span>
    </div>

    <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning text-center py-5 shadow-sm rounded-4">
        <h4 class="mb-3">😞 No trains found for the selected route and date.</h4>
        <p class="text-muted">Please try searching for a different date or route.</p>
        <a href="/search" class="btn btn-primary mt-2 px-4 fw-bold">Try Another Search</a>
    </div>

    <div class="card shadow-sm border-0 mb-4 rounded-4" th:each="train : ${trains}">

        <div class="card-header bg-light border-bottom py-3 px-4 d-flex justify-content-between align-items-center rounded-top-4">
            <div>
                <h4 class="fw-bold text-dark mb-0" th:text="${train.trainName}"></h4>
            </div>
            <div class="d-flex gap-4 text-center">
                <div>
                    <small class="text-muted text-uppercase fw-bold">Departure</small><br>
                    <span class="fs-5 fw-bold" th:text="${train.departureTime}"></span>
                </div>
                <div>
                    <i class="text-muted fs-4">→</i>
                </div>
                <div>
                    <small class="text-muted text-uppercase fw-bold">Arrival</small><br>
                    <span class="fs-5 fw-bold" th:text="${train.arrivalTime}"></span>
                </div>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-secondary text-muted small text-uppercase">
                    <tr>
                        <th class="ps-4">Class Type</th>
                        <th>Unit Price</th>
                        <th>Availability</th>
                        <th class="text-end pe-4">Booking Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="seatClass : ${train.seatClasses}">
                        <td class="ps-4">
                            <strong class="fs-6" th:text="${seatClass.classType} + ' Class'"></strong>
                        </td>
                        <td>
                            Rs. <span th:text="${seatClass.price}"></span>
                        </td>
                        <td>
                                <span class="badge bg-success bg-opacity-10 text-success px-2 py-1 border border-success border-opacity-25"
                                      th:if="${seatClass.availableSeats > 0}"
                                      th:text="${seatClass.availableSeats} + ' seats left'"></span>
                            <span class="badge bg-danger bg-opacity-10 text-danger px-2 py-1"
                                  th:if="${seatClass.availableSeats == 0}">Sold Out</span>
                        </td>
                        <td class="pe-4 text-end">

                            <form th:action="@{/booking/confirm}" method="get"
                                  class="d-flex justify-content-end align-items-center m-0"
                                  th:if="${seatClass.availableSeats > 0}">

                                <input type="hidden" name="trainId" th:value="${train.id}">
                                <input type="hidden" name="seatClassId" th:value="${seatClass.id}">
                                <input type="hidden" name="journeyDate" th:value="${journeyDate}">

                                <div class="input-group input-group-sm me-3" style="width: 110px;">
                                    <span class="input-group-text bg-white">Qty</span>
                                    <input type="number" name="quantity" class="form-control text-center fw-bold"
                                           value="1" min="1" th:max="${seatClass.availableSeats}"
                                           th:data-price="${seatClass.price}"
                                           onchange="updatePrice(this)" onkeyup="updatePrice(this)" required>
                                </div>

                                <div class="me-4 text-end" style="min-width: 120px;">
                                    <small class="text-muted">Total:</small><br>
                                    <strong class="text-danger fs-6">Rs. <span class="total-price" th:text="${seatClass.price}"></span></strong>
                                </div>

                                <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">Book Now</button>
                            </form>

                            <span class="text-muted fw-bold" th:if="${seatClass.availableSeats == 0}">Not Available</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-center mt-4 mb-5">
        <a href="/search" class="btn btn-outline-secondary px-4 fw-bold">← Back to New Search</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function updatePrice(input) {
        let qty = parseInt(input.value);
        let maxQty = parseInt(input.getAttribute('max'));

        if(qty > maxQty) {
            input.value = maxQty;
            qty = maxQty;
        } else if (qty < 1 || isNaN(qty)) {
            qty = 1;
        }

        let price = parseFloat(input.getAttribute('data-price'));
        let total = qty * price;
        input.closest('form').querySelector('.total-price').innerText = total.toFixed(2);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
