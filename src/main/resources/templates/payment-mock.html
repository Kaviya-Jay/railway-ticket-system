<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mock Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Mock Payment</h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/payment/process}" method="post">
                <input type="hidden" name="trainId" th:value="${trainId}">
                <input type="hidden" name="seatClassId" th:value="${seatClassId}">
                <input type="hidden" name="journeyDate" th:value="${journeyDate}">
                <input type="hidden" name="quantity" th:value="${quantity}">

                <div class="mb-3">
                    <label>Card Number</label>
                    <input type="text" name="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Expiry Date</label>
                        <input type="text" name="expiry" class="form-control" placeholder="MM/YY" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>CVV</label>
                        <input type="text" name="cvv" class="form-control" placeholder="123" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning btn-lg">Pay Now (Mock)</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
