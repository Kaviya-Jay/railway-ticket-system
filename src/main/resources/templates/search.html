<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Search Trains</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">🔍 Search Trains</h4>
    </div>
    <div class="card-body">

      <!-- General Error Message -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <!-- Field-Specific Errors -->
      <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
        <ul>
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
        </ul>
      </div>

      <form th:action="@{/search}" th:object="${searchRequest}" method="post">
        <div class="row g-3">
          <!-- From Station -->
          <div class="col-md-4">
            <label class="form-label">From Station</label>
            <select th:field="*{startStationId}" class="form-select" required>
              <option value="">-- Select Start Station --</option>
              <option th:each="station : ${stations}"
                      th:value="${station.id}"
                      th:text="${station.stationName}"></option>
            </select>
            <div th:if="${#fields.hasErrors('startStationId')}" class="text-danger" th:errors="*{startStationId}"></div>
          </div>

          <!-- To Station -->
          <div class="col-md-4">
            <label class="form-label">To Station</label>
            <select th:field="*{endStationId}" class="form-select" required>
              <option value="">-- Select End Station --</option>
              <option th:each="station : ${stations}"
                      th:value="${station.id}"
                      th:text="${station.stationName}"></option>
            </select>
            <div th:if="${#fields.hasErrors('endStationId')}" class="text-danger" th:errors="*{endStationId}"></div>
          </div>

          <!-- Journey Date -->
          <div class="col-md-4">
            <label class="form-label">Journey Date</label>
            <input type="date"
                   th:field="*{journeyDate}"
                   min="${minDate}"
                   max="${maxDate}"
                   class="form-control"
                   required>
            <small class="text-muted">Tomorrow onwards • Maximum 60 days</small>
            <div th:if="${#fields.hasErrors('journeyDate')}" class="text-danger" th:errors="*{journeyDate}"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4 py-3">
          🔍 Search Trains
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
