<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Search Trains</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>   <!-- You can create fragments later -->

<div class="container mt-5">
  <h2 class="text-center mb-4">Search Trains</h2>
  <div class="card">
    <div class="card-body">
      <form th:action="@{/search}" method="post">
        <div class="row g-3">
          <div class="col-md-4">
            <label>From Station</label>
            <select name="startStationId" class="form-select" required>
              <option value="">-- Select --</option>
              <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.stationName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label>To Station</label>
            <select name="endStationId" class="form-select" required>
              <option value="">-- Select --</option>
              <option th:each="station : ${stations}" th:value="${station.id}" th:text="${station.stationName}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label>Journey Date</label>
            <input type="date" name="journeyDate" th:value="${journeyDate}" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4 w-100">Search Trains</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
