<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Railway Ticket Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>body { background: linear-gradient(to right, #0f2027, #203a43, #2c5364); color: white; }</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🚄 Sri Lanka Railways</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/search" th:if="${#authorization.expr('isAuthenticated()')}">Search Trains</a>
            <a class="nav-link" href="/login" sec:authorize="isAnonymous()">Login</a>
            <a class="nav-link" href="/register" sec:authorize="isAnonymous()">Register</a>
            <a class="nav-link" href="/dashboard" sec:authorize="isAuthenticated()">Dashboard</a>
            <a class="nav-link" href="/logout" sec:authorize="isAuthenticated()">Logout</a>
        </div>
    </div>
</nav>

<div class="container text-center mt-5">
    <h1 class="display-3 fw-bold">Book Your Train Ticket Online</h1>
    <p class="lead">Fast • Secure • Real-time Seat Availability</p>
    <a href="/search" class="btn btn-warning btn-lg mt-4">Search Trains Now →</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
