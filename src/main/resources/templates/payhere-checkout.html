<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment - Redirecting...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loader {
            border: 8px solid #f3f3f3; border-top: 8px solid #0d6efd;
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-lg border-0 rounded-4 p-5">
                <div class="loader mb-4"></div>
                <h3 class="fw-bold text-dark mb-3">Connecting to Secure Payment Gateway...</h3>
                <p class="text-muted mb-4">Please wait while we securely transfer you to PayHere to complete your transaction. Do not refresh or close this page.</p>

                <form method="post" action="https://sandbox.payhere.lk/pay/checkout" id="payhere-form">
                    <input type="hidden" name="merchant_id" th:value="${merchantId}">
                    <input type="hidden" name="return_url" th:value="${returnUrl}">
                    <input type="hidden" name="cancel_url" th:value="${cancelUrl}">
                    <input type="hidden" name="notify_url" th:value="${notifyUrl}">
                    <input type="hidden" name="order_id" th:value="${orderId}">
                    <input type="hidden" name="items" th:value="${items}">
                    <input type="hidden" name="currency" th:value="${currency}">
                    <input type="hidden" name="amount" th:value="${amount}">
                    <input type="hidden" name="first_name" th:value="${user.fullName}">
                    <input type="hidden" name="last_name" value=".">
                    <input type="hidden" name="email" th:value="${user.email}">
                    <input type="hidden" name="phone" th:value="${user.mobile}">
                    <input type="hidden" name="address" value="Sri Lanka">
                    <input type="hidden" name="city" value="Colombo">
                    <input type="hidden" name="country" value="Sri Lanka">
                    <input type="hidden" name="hash" th:value="${hash}">

                    <input type="hidden" name="custom_1" th:value="${custom1}">
                    <input type="hidden" name="custom_2" th:value="${custom2}">

                    <button type="submit" class="btn btn-outline-primary mt-3 d-none" id="manual-btn">Click Here if not redirected automatically</button>
                </form>

                <img src="https://www.payhere.lk/downloads/images/payhere_long_banner.png" alt="PayHere" class="img-fluid mt-4" style="max-width: 250px;">
            </div>
        </div>
    </div>
</div>

<script>
    // තත්පර 2කින් පසු ස්වයංක්‍රීයව PayHere වෙත ගමන් කිරීම
    window.onload = function() {
        setTimeout(function() {
            document.getElementById('payhere-form').submit();
        }, 2000);

        setTimeout(function() {
            document.getElementById('manual-btn').classList.remove('d-none');
        }, 5000);
    };
</script>
</body>
</html>
