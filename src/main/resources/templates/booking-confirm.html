<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Confirm Your Booking</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Passenger:</strong> <span th:text="${user.fullName}"></span> (<span th:text="${user.nic}"></span>)</p>
            <p><strong>Journey Date:</strong> <span th:text="${journeyDate}"></span></p>
            <p><strong>Tickets (Quantity):</strong> <span th:text="${quantity}"></span> Seats</p>

            <form th:action="@{/payment/checkout}" method="post">
                <input type="hidden" name="trainId" th:value="${trainId}">
                <input type="hidden" name="seatClassId" th:value="${seatClassId}">
                <input type="hidden" name="journeyDate" th:value="${journeyDate}">
                <input type="hidden" name="quantity" th:value="${quantity}">

                <button type="submit" class="btn btn-primary btn-lg mt-3 fw-bold">Proceed to Secure Payment ➔</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
