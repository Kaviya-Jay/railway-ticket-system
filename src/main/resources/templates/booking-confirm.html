<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirm Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>Confirm Your Booking</h2>
  <div class="card">
    <div class="card-body">
      <p><strong>Passenger:</strong> <span th:text="${user.fullName}"></span> (<span th:text="${user.nic}"></span>)</p>
      <p><strong>Journey Date:</strong> <span th:text="${journeyDate}"></span></p>

      <!-- Train and seat details would be fetched in controller and added to model in real code -->

      <form th:action="@{/book}" method="post">
        <input type="hidden" name="trainId" th:value="${trainId}">
        <input type="hidden" name="seatClassId" th:value="${seatClassId}">
        <input type="hidden" name="journeyDate" th:value="${journeyDate}">

        <button type="submit" class="btn btn-warning btn-lg">Proceed to Mock Payment →</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
