<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet"> <!-- Optional: Include your custom CSS -->
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav> <!-- Optional: Include navbar if needed -->

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h4>Verify Your OTP</h4>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
                    <p class="text-center text-muted">An OTP has been sent to your email. Please enter it below to complete registration.</p>

                    <form th:action="@{/otp-verify}" method="post">
                        <div class="mb-3">
                            <label class="form-label">OTP Code</label>
                            <input type="text" name="otp" class="form-control" placeholder="Enter 6-digit OTP" required maxlength="6">
                        </div>
                        <button type="submit" class="btn btn-info w-100 py-3">Verify OTP</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/register">Back to Registration</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
