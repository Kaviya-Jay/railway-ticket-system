<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>User Profile</h2>
    <div class="card">
        <div class="card-body">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/user/profile/update}" method="post">
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${user.email}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Mobile</label>
                    <input type="text" name="mobile" th:value="${user.mobile}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>New Password (optional)</label>
                    <input type="password" name="password" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>

            <form th:action="@{/user/profile/delete}" method="post" class="mt-4">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure? This cannot be undone.')">Delete Account</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
