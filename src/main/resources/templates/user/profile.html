<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">⚙️ Profile Settings</h4>
                </div>
                <div class="card-body">

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">NIC (Username)</label>
                            <input type="text" class="form-control bg-light" th:value="${user.nic}" disabled>
                            <small class="text-muted">NIC cannot be changed.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" name="mobile" class="form-control" th:value="${user.mobile}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">New Password (Optional)</label>
                            <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Update Profile</button>
                    </form>

                    <hr class="my-4">

                    <h5 class="text-danger fw-bold">Danger Zone</h5>
                    <p class="text-muted small">Once you delete your account, there is no going back. All your bookings will be permanently lost.</p>
                    <form th:action="@{/profile/delete}" method="post" onsubmit="return confirm('Are you sure you want to completely delete your account? This action cannot be undone!');">
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Delete Account</button>
                    </form>

                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
