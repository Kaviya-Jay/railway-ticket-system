<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard - Railway System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .welcome-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
        }
        .ticket-card {
            transition: all 0.3s;
        }
        .ticket-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">

    <!-- Welcome Card -->
    <div class="welcome-card p-5 mb-5 text-center">
        <h1>Welcome back, <span th:text="${user.fullName}" class="fw-bold"></span>!</h1>
        <p class="lead">NIC: <span th:text="${user.nic}"></span></p>
        <a href="/search" class="btn btn-light btn-lg mt-3">
            <i class="bi bi-search"></i> Search & Book New Ticket
        </a>
    </div>

    <!-- Quick Stats -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card text-center ticket-card">
                <div class="card-body">
                    <h3 class="text-success" th:text="${myBookings != null ? myBookings.size() : 0}"></h3>
                    <p class="text-muted">Total Tickets Booked</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center ticket-card">
                <div class="card-body">
                    <h3 class="text-primary">3</h3>
                    <p class="text-muted">Quota Remaining (24 hrs)</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center ticket-card">
                <div class="card-body">
                    <h3 class="text-warning">₹0</h3>
                    <p class="text-muted">Total Spent</p>
                </div>
            </div>
        </div>
    </div>

    <!-- My Recent Bookings -->
    <h3 class="mb-4">My Recent Bookings</h3>

    <div th:if="${myBookings != null and !myBookings.isEmpty()}" class="row">
        <div class="col-12" th:each="booking : ${myBookings}">
            <div class="card ticket-card mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h5>
                                <span th:text="${booking.train.startStation.stationName}"></span>
                                →
                                <span th:text="${booking.train.endStation.stationName}"></span>
                            </h5>
                            <p>
                                <strong>Date:</strong> <span th:text="${booking.journeyDate}"></span><br>
                                <strong>Train:</strong> <span th:text="${booking.train.trainName}"></span><br>
                                <strong>Class:</strong> <span th:text="${booking.seatClass.classType}"></span> Class<br>
                                <strong>Transaction ID:</strong> <span class="text-primary fw-bold" th:text="${booking.transactionId}"></span>
                            </p>
                        </div>
                        <div class="col-md-4 text-end">
                            <a th:href="@{/download/pdf/{id}(id=${booking.transactionId})}"
                               class="btn btn-success btn-sm mb-2">
                                📄 Download PDF Ticket
                            </a>
                            <br>
                            <a th:href="@{/tickets/QR-{id}.png(id=${booking.transactionId})}"
                               target="_blank" class="btn btn-outline-primary btn-sm">
                                View QR Code
                            </a>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-muted">
                    Booked on: <span th:text="${booking.bookingTime}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- No bookings message -->
    <div th:if="${myBookings == null or myBookings.isEmpty()}" class="alert alert-info text-center py-5">
        <h4>You haven't booked any tickets yet.</h4>
        <a href="/search" class="btn btn-primary btn-lg mt-3">Book Your First Ticket Now →</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
