<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h2>Welcome, <span th:text="${user.fullName}"></span>!</h2>

    <div class="row mt-4 mb-4">
        <div class="col-md-4">
            <div class="card text-bg-primary mb-3 text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Tickets Booked</h5>
                    <p class="card-text fs-2 fw-bold" th:text="${totalTicketsBooked}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-success mb-3 text-center">
                <div class="card-body">
                    <h5 class="card-title">24h Quota Remaining</h5>
                    <p class="card-text fs-2 fw-bold" th:text="${quotaRemaining}">3</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-warning mb-3 text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Spent</h5>
                    <p class="card-text fs-2 fw-bold">Rs. <span th:text="${totalSpent}">0.00</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-4">
        <a href="/profile" class="btn btn-outline-dark fw-bold">⚙️ Manage Profile Settings</a>
        <a href="/search" class="btn btn-primary fw-bold">➕ Book New Ticket</a>
    </div>

    <h4>Your Booking History</h4>
    <div class="table-responsive">
        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
            <tr>
                <th>Transaction ID</th>
                <th>Journey Date</th>
                <th>Train</th>
                <th>Class</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking : ${bookings}">
                <td th:text="${booking.transactionId}"></td>
                <td th:text="${booking.journeyDate}"></td>
                <td th:text="${booking.train.trainName}"></td>
                <td th:text="${booking.seatClass.classType}"></td>
                <td th:text="${booking.quantity}"></td>
                <td>
                    <span class="badge bg-success" th:if="${booking.status == 'CONFIRMED'}">CONFIRMED</span>
                    <span class="badge bg-danger" th:if="${booking.status != 'CONFIRMED'}" th:text="${booking.status}"></span>
                </td>
                <td>
                    <a th:href="@{/download/pdf/{id}(id=${booking.transactionId})}" class="btn btn-sm btn-info fw-bold">📄 PDF</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="7" class="text-center text-muted">No bookings found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
