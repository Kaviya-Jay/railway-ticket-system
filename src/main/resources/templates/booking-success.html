<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-success text-white">
<div class="container text-center mt-5">
    <h1 class="display-4">🎉 Booking Confirmed!</h1>
    <h3>Transaction ID: <span th:text="${transactionId}" class="text-warning"></span></h3>

    <div class="mt-4">
        <a th:href="@{/download/pdf/{id}(id=${transactionId})}" class="btn btn-light btn-lg">Download PDF Ticket</a>
        <a th:href="@{/tickets/QR-{id}.png(id=${transactionId})}" class="btn btn-light btn-lg" target="_blank">View QR Code</a>
    </div>

    <a href="/dashboard" class="btn btn-outline-light mt-4">Go to Dashboard</a>
</div>
</body>
</html>
