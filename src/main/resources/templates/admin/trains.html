<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage Trains</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Trains Management</h2>
    <a href="/admin/trains/new" class="btn btn-success">+ Add New Train</a>
  </div>

  <table class="table table-hover">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Train Name</th>
      <th>From</th>
      <th>To</th>
      <th>Departure</th>
      <th>Arrival</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="train : ${trains}">
      <td th:text="${train.id}"></td>
      <td th:text="${train.trainName}"></td>
      <td th:text="${train.startStation.stationName}"></td>
      <td th:text="${train.endStation.stationName}"></td>
      <td th:text="${train.departureTime}"></td>
      <td th:text="${train.arrivalTime}"></td>
      <td>
        <a th:href="@{/admin/trains/edit/{id}(id=${train.id})}" class="btn btn-sm btn-primary">Edit</a>
        <a th:href="@{/admin/trains/delete/{id}(id=${train.id})}"
           class="btn btn-sm btn-danger"
           onclick="return confirm('Delete train?')">Delete</a>
        <a th:href="@{/admin/trains/{id}/seats(id=${train.id})}" class="btn btn-sm btn-info">Manage Seats</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
