<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Train Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h4 th:text="${train.id} != null ? 'Edit Train' : 'Add New Train'"></h4>
    </div>
    <div class="card-body">
      <form th:action="@{/admin/trains}" th:object="${train}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label>Train Name</label>
          <input type="text" th:field="*{trainName}" class="form-control" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>From Station</label>
            <select th:field="*{startStation.id}" class="form-select" required>
              <option value="">-- Select --</option>
              <option th:each="s : ${stations}" th:value="${s.id}" th:text="${s.stationName}"></option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label>To Station</label>
            <select th:field="*{endStation.id}" class="form-select" required>
              <option value="">-- Select --</option>
              <option th:each="s : ${stations}" th:value="${s.id}" th:text="${s.stationName}"></option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Departure Time</label>
            <input type="time" th:field="*{departureTime}" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Arrival Time</label>
            <input type="time" th:field="*{arrivalTime}" class="form-control" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Save Train</button>
        <a href="/admin/trains" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
