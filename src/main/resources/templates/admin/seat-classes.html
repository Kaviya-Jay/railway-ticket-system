<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Seats - <span th:text="${train.trainName}"></span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h3>Seat Management - <span th:text="${train.trainName}"></span></h3>
    <a th:href="@{/admin/trains}" class="btn btn-secondary mb-3">← Back to Trains</a>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Class Type</th>
            <th>Price (Rs.)</th>
            <th>Total Seats</th>
            <th>Available Seats</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sc : ${seatClasses}">
            <td th:text="${sc.classType}"></td>
            <td th:text="${sc.price}"></td>
            <td th:text="${sc.totalSeats}"></td>
            <td>
                <form th:action="@{/admin/seats/update/{id}(id=${sc.id})}" method="post" class="d-inline">
                    <input type="number" name="availableSeats" th:value="${sc.availableSeats}"
                           class="form-control d-inline w-50" min="0">
                    <button type="submit" class="btn btn-sm btn-warning">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
