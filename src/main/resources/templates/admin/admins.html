<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Admins - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 15px; }
        .sidebar a { color: #c2c7d0; text-decoration: none; padding: 12px 20px; display: block; font-weight: 500; border-bottom: 1px solid #4f5962; transition: 0.3s; }
        .sidebar a:hover { background-color: #495057; color: #ffffff; }
        .sidebar a.active { background-color: #0d6efd; color: #ffffff; border-left: 4px solid #ffffff; }
        .sidebar-heading { color: #ffffff; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; padding: 10px 20px; margin-top: 10px; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-3 col-lg-2 px-0 sidebar shadow-sm">
            <div class="text-center mb-3"><h5 class="text-white fw-bold mt-2">ADMIN PANEL</h5></div>

            <div class="sidebar-heading">Core</div>
            <a href="/admin/dashboard">📊 Dashboard</a>

            <div class="sidebar-heading">Management</div>
            <a href="/admin/trains">🚂 Manage Trains</a>
            <a href="/admin/stations">🚉 Manage Stations</a>
            <a href="/admin/trains">💺 Manage Seat (Quota)</a>

            <div class="sidebar-heading">Users & Settings</div>
            <a href="/admin/quota">🎟️ Ticket Booking Quota</a>
            <a href="/admin/admins" class="active">👨‍💼 Manage Admins</a>
            <a href="/admin/users">👥 Manage Users</a>

            <div class="sidebar-heading">Analytics</div>
            <a href="/admin/reports">📈 Transportation Reports</a>
        </div>

        <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark">System Administrators</h2>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                            <tr>
                                <th>#ID</th>
                                <th>NIC</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="admin : ${admins}">
                                <td th:text="${admin.id}"></td>
                                <td class="fw-bold text-primary" th:text="${admin.nic}"></td>
                                <td th:text="${admin.fullName}"></td>
                                <td th:text="${admin.email}"></td>
                                <td th:text="${admin.mobile}"></td>
                                <td><span class="badge bg-danger">ADMIN</span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
