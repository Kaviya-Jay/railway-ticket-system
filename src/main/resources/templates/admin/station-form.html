<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Station Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${station.id} != null ? 'Edit Station' : 'Add New Station'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/stations}" th:object="${station}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label>Station Name</label>
                    <input type="text" th:field="*{stationName}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Location</label>
                    <input type="text" th:field="*{location}" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">Save Station</button>
                <a href="/admin/stations" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
