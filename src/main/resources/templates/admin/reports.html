<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5">
    <h2>Transaction Reports</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center bg-info text-white">
                <div class="card-body">
                    <h4>Total Bookings</h4>
                    <h2 th:text="${totalBookings}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center bg-success text-white">
                <div class="card-body">
                    <h4>Today’s Bookings</h4>
                    <h2 th:text="${todayBookings}"></h2>
                </div>
            </div>
        </div>
    </div>

    <h5>Recent 10 Bookings</h5>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Transaction ID</th>
            <th>Passenger</th>
            <th>Train</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${recentBookings}">
            <td th:text="${b.transactionId}"></td>
            <td th:text="${b.user.fullName}"></td>
            <td th:text="${b.train.trainName}"></td>
            <td th:text="${b.journeyDate}"></td>
            <td><span class="badge bg-success" th:text="${b.status}"></span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
