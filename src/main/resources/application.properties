spring.application.name=railway-ticket-system

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/railway_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# File upload for tickets (create folder tickets/ in project root)
app.ticket.storage.path=./tickets

# Security
server.servlet.session.tracking-modes=cookie
